[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-workflow-rag"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "smind-rag-structurizer",
  "smind-rag-constructor",
  "smind-rag-vectorizer",
]

[tool.setuptools.packages.find]
where = ["src"]

