[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-provider-runtime"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "smind-config>=0.1.0",
    "smind-rag-vectorizer>=0.1.0",
    "smind-vector-sqlite-vec>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
