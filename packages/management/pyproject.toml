[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-management"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "smind-rag-vectorizer>=0.1.0",
  "smind-workflow-core>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
