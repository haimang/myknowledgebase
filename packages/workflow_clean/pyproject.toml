[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-workflow-clean"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "smind-cleaners-universal",
  "smind-providers-dedicated",
]

[tool.setuptools.packages.find]
where = ["src"]

