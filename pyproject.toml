[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myknowledgebase"
version = "1.0.0"
description = "MKB: a standalone, stateful LS-RAG leaf worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}
authors = [{name = "MKB maintainers"}]
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "pyturso>=0.7.2",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[project.scripts]
mkb = "api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*", "intake*"]
exclude = ["context*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
