[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "smind-common>=0.1.0",
  "smind-config>=0.1.0",
  "smind-contracts>=0.1.0",
  "smind-storage-sqlite>=0.1.0",
  "smind-storage-objects>=0.1.0",
  "smind-auth>=0.1.0",
  "smind-team>=0.1.0",
  "smind-ingestion>=0.1.0",
  "smind-management>=0.1.0",
  "smind-vector-sqlite-vec>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
