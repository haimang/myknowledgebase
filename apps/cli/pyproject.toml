[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smind-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "smind-common>=0.1.0",
  "smind-config>=0.1.0",
  "smind-contracts>=0.1.0",
  "smind-storage-sqlite>=0.1.0",
  "smind-vector-sqlite-vec>=0.1.0",
  "smind-management>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
