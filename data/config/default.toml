[application]
name = "mkb"
api_version = "v1"

[database]
logical_name = "mkb_primary"
concurrent_writes_required = true
native_vector_required = true

[inference]
vllm_base_url = "http://127.0.0.1:668"
probe_enabled = false
embed_model = "qwen-vl-2b"
generate_model = "qwen35-a3b"

[storage]
max_object_bytes = 268435456

[workflow]
# A terminal Process stays recoverable briefly before the runtime records an
# append-only cleanup eligibility fence. Physical retention is separate.
cleanup_recovery_window_seconds = 60

[index_retirement]
# The duration is frozen into each S09 cleanup intent at cutover; changing
# this checked-in default affects only later promotions.
grace_seconds = 3600
scan_interval_seconds = 600
scan_batch_size = 100

[security]
metrics_require_token = false
